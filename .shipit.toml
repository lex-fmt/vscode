# [secrets] — repo Actions secrets. Each table key is the GitHub secret NAME; the
# value names exactly one source ({ doppler = "KEY" } / { env = "VAR" } /
# { prompt = true }). Seeded with shipit's local-reviewer (codex/agy) GitHub App
# credentials, each sourced from Doppler github/prd. `shipit gh-setup` only pushes
# a secret when its source resolves, so these are safe before the App is installed.
[secrets]
CODEX_REVIEW_APP_PRIVATE_KEY = { doppler = "CODEX_REVIEW_APP_PRIVATE_KEY" }
CODEX_REVIEW_APP_ID          = { doppler = "CODEX_REVIEW_APP_ID" }
AGY_REVIEW_APP_PRIVATE_KEY   = { doppler = "AGY_REVIEW_APP_PRIVATE_KEY" }
AGY_REVIEW_APP_ID            = { doppler = "AGY_REVIEW_APP_ID" }

# [reviewers] — the required-reviewer SET for this repo's PRs (the map KEYS are
# required; ALL must be DONE to flip Ready). Seeded with shipit's shipped default
# (Copilot, review-once), rendered from the single source in
# `prstate.reviewers_config.DEFAULT_REVIEWERS`. codex/agy are NOT seeded by default —
# their review GitHub Apps are not installed on an arbitrary repo, so requiring them
# would park PRs at REVIEWS_PENDING; a repo that HAS the Apps opts them in here (e.g.
# `codex = {}`). Review-once: `rerun` defaults OFF (token-billed; opt in per reviewer
# with e.g. `copilot = { rerun = true }`).
[reviewers]
copilot = {}

# [lint].ignore — paths the managed lint gate must SKIP. Seeded with common
# generated/assembled files (a built CHANGELOG, package lockfiles) that are not
# hand-written prose, so a freshly-onboarded repo does not take a latent gate
# failure on them. Gitignore-style globs. You OWN this list and may extend it —
# it is reconcile-safe: `shipit install` seeds [lint] only when absent and never
# clobbers a table you have edited.
[lint]
ignore = [
  "CHANGELOG.md",
  "CHANGELOG/**",
  "package-lock.json",
  "pnpm-lock.yaml",
  # Test fixtures are non-hand-authored test data, not source: label-policy.lex is
  # an intentional NEGATIVE fixture (deliberately-forbidden labels, to exercise
  # lexd's diagnostics), and the sample-workspace docs symlink external benchmark
  # corpus in from the `comms` submodule — none should gate this repo. Mirrors the
  # repo's existing .prettierignore exclusion of the same dir ("Test fixtures are
  # intentionally unformatted"); keeps the lex leg off them the way prettier already is.
  "test/fixtures/**",
]

# [lanes] — the declared PR-time check units (ADP02-WS03, #155; model: lex#829).
# The lane planner (`shipit ci plan`) maps these + the CI event + a path-diff to
# the job matrix the wf-checks workflow block runs (`pixi run --locked <run>` per
# job). Both lanes' tasks SELF-PROVISION, because on a hosted runner nothing
# outside pixi is provisioned:
#   - `lint-full` (NOT the managed bare `lint` task, which runs in the default
#     env where no lint tool exists) resolves into the pixi lint env, which
#     carries the lex leg's lexd as an ordinary conda dep off the managed
#     `shipit-lexd` feature (ADR-0066 retired the `provision lexd` verb this
#     task used to call inline) — see its definition in pixi.toml
#     [feature.lint.tasks].
#   - `test-full` inits the `comms` submodule (gen-theme's canonical theme data
#     rides it, and the legacy caller passed `submodules: true`), builds the
#     shared/ module, then runs the legacy check-command verbs (typecheck via
#     `npm run build`, eslint, unit tests) plus the `.vsix` tree-sitter payload
#     check (INJ001-WS05, #167 — packages the artifact and fails when the
#     grammar payload is not in it) — the wf-checks checkout has no
#     submodule support; node/npm, python (gen-theme) and uv (for bin/shipit)
#     ride pixi's default env ([dependencies] in pixi.toml).
[lanes.lint]
run = "lint-full"
required = true
local = true

[lanes.test]
run = "test-full"
required = true
local = true

[toolchains]
"." = "npm"

# [artifacts] — this repo's declared release surface for the shipit release
# pipeline (ADP02-WS09, arthur-debert/shipit#842 — the FIRST CONSUMER FIRE of
# the TOL02-WS13 composition, shipit#821: per-target .vsix + the
# vscode-marketplace/open-vsx endpoints). ONE artifact: the extension itself.
#
#   - build: the bare `npm` leg ([toolchains] "." above) — `npm run build`
#     (tsc). The per-target packaging is the BUNDLE step, not the build.
#   - platforms: the four legacy lanes. The vsix composition maps each closed
#     platform name to its vsce target string (shipit VSCE_TARGETS:
#     linux-x86_64 → linux-x64, windows-x86_64 → win32-x64) and writes
#     `<name>-<vsce-target>.vsix` — so `lex-vscode` + these four platforms
#     reproduce legacy v0.11.3's asset set name-for-name:
#     lex-vscode-{darwin-arm64,linux-arm64,linux-x64,win32-x64}.vsix.
#   - endpoints: gh-release + both marketplaces, per #821's decision record
#     and the #842 doctrine. Both marketplace endpoints are external
#     REGISTRIES: the central RC guard drops them on a `-release-rc` cut
#     (rc proof = build + gh-release only); a REAL marketplace/open-vsx
#     publish is an owner call at the gate. Tokens: VSCE_PAT / OVSX_PAT
#     (repo secrets, present — forwarded by the shipit-release.yml caller).
#
# FLAGGED gaps (per the issue: flag, never work around):
#   1. win32-x64: the plan's windows-x86_64 lane runs on `windows-latest`
#      executing shipit itself (the bundle verb runs on the lane's runner) —
#      shipit is not yet win-importable (arthur-debert/shipit#893, fix in
#      flight). The win32 leg of the rc proof depends on that landing
#      shipit-side; not worked around here.
#   2. Native-deps staging: RESOLVED (ARF02-WS04, this repo's #160 /
#      arthur-debert/shipit#1003). The lexd-lsp LSP now rides the Artifact
#      channel as a per-platform conda package (`[artifact-deps.lexd-lsp]`
#      below), and the vsix composition's `bundle.stage` map copies the
#      pixi-materialized binary into `resources/lexd-lsp` before
#      `vsce package` (TOL03-WS03 #974/#980). No bespoke fetch-deps, no
#      deps.json path — the channel already put the right per-subdir binary
#      in the build env; staging is a copy. The tree-sitter wasm/query half —
#      flagged here as "a separate, later concern" — is now closed too, by
#      `[stage.tree-sitter]` below (#171): a shipit-cut `.vsix` carries the
#      Lex grammar, not just the LSP.
#   3. open-vsx: declared (per #821: "wired-but-off until the consumer's
#      OVSX_PAT verifies" — declaring IS the per-repo config choice), but
#      the legacy release.yml records two live blockers: the stored
#      OVSX_PAT fails /api/lex/verify-pat (needs regeneration by the
#      namespace owner) and v0.10.7 is stuck "Under review" open-vsx-side.
#      rc's are unaffected (RC guard); a real open-vsx publish stays
#      blocked until both clear.
[artifacts.lex-vscode]
build = ["npm"]
platforms = ["darwin-arm64", "linux-arm64", "linux-x86_64", "windows-x86_64"]
# bundle.stage (TOL03-WS03 #974/#980): the vsix composition stages the
# `lexd-lsp` native binary from the `[artifact-deps.lexd-lsp]` pin below into
# `resources/lexd-lsp` before `vsce package`, so each non-Windows .vsix ships
# the real LSP the extension spawns (see src/config.ts: the bundled binary is
# `./resources/lexd-lsp`). Copied off the pixi env the Artifact channel
# materialized — never a bespoke fetch (#911 stays retired). Only `lexd-lsp`
# rides THIS map, because it is the one payload that is PER-TARGET: the lane's
# runner holds the binary for the target it is packaging. The grammar is
# universal, so it is staged by the standalone `[stage.tree-sitter]` map below
# instead — durable rather than transient, and shared with the dev and check
# lanes.
bundle = { composition = "vsix", stage = { "lexd-lsp" = "resources/lexd-lsp" } }
endpoints = ["gh-release", "vscode-marketplace", "open-vsx"]

# [artifact-deps] — cross-repo Artifact-channel pins (ARF02, ADR-0064/0065).
# `shipit install` projects each into a managed pixi block (the reserved
# `shipit-artifacts` feature wired into the default env) so pixi
# resolves/locks/sha256-verifies it like any ordinary dependency, authless off
# lex-fmt/lex's public per-repo conda channel. The VERSION is consumer-owned and
# is NOT declared here (conda-direct, ADR-0077): it lives in the same pixi
# feature that carries the derived channel — `[feature.shipit-artifacts.dependencies]`
# in pixi.toml. A version bump is a bump there, re-resolved transparently through
# `pixi install`/`update` (commit the updated pixi.lock).
#
# lexd-lsp is the LSP the extension bundles; the pinned version is the one WS03
# retained in the channel (verified live on osx-arm64/linux-64/linux-aarch64 —
# the served non-Windows subdirs; no osx-64, no win-64, matching the channel's
# closed subdir map per arthur-debert/shipit `docs/spec/artifact-channel.md`).
# It is a TOOL artifact (binary on PATH), staged into the vsix via
# [artifacts.lex-vscode].bundle.stage above.
[artifact-deps.lexd-lsp]
repo = "lex-fmt/lex"

# tree-sitter is the Lex GRAMMAR (lex-fmt/tree-sitter-lex), a NOARCH data
# package. The extension cannot compile the grammar's C sources the way the nvim
# plugin does, so what it consumes is the prebuilt `tree-sitter-lex.wasm`
# web-tree-sitter loads (src/treesitter.ts) plus the `queries/`. Staged by
# `[stage.tree-sitter]` below; version pinned in pixi.toml beside lexd-lsp's.
# This replaces the deps.json + `fetch-deps` gh-release download one-for-one
# (#171) — same files, same destinations, only the SOURCE axis swapped from a
# tarball download to a read of the already-resolved env prefix.
[artifact-deps.tree-sitter]
repo = "lex-fmt/tree-sitter-lex"

# [stage] — the app-consumer half of conda-direct (arthur-debert/shipit#1079):
# once pixi has resolved and extracted the conda package into the env prefix,
# copy the files this repo SHIPS into its bundle. Sources are relative to
# `<root>/.pixi/envs/default`, dests to the checkout (bounded to `resources/`).
# `npm run bundle` runs `./bin/shipit stage` (package.json), and `vsce package`
# runs `bundle` through `vscode:prepublish` — so the Lex grammar arrives by the
# SAME road as the other two payload halves (`copy-wasm` for the
# web-tree-sitter runtime, `stage-grammars` for the five npm-sourced embedded
# grammars), on the release path and the local one alike.
#
# NARROW entries, not nvim's whole-directory copy, and the difference is
# deliberate: nvim's destination is gitignored and dev/CI-only, so the ~66 KB it
# does not read costs nothing, while vscode's staged files land INSIDE the
# shipped `.vsix`. Of the package's 554 KB, 474 KB is `src/` — parser.c,
# scanner.c, grammar.json, node-types.json, the tree_sitter headers — which
# exists so a consumer can COMPILE the grammar. This extension loads the wasm
# and cannot compile anything, so a whole-directory stage would put half a
# megabyte of dead C into every published artifact, four targets over. The two
# dests are also the exact paths `src/treesitter.ts` loads and `.vscodeignore`
# re-includes, so the mapping is legible against the runtime rather than
# needing a rename step. The cost of narrowness is an edit here if the producer
# renames one of these two files — a trade worth making when the payload ships.
[stage.tree-sitter]
"share/tree-sitter/tree-sitter-lex.wasm" = "resources/tree-sitter-lex.wasm"
"share/tree-sitter/queries" = "resources/queries"

