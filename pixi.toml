# pixi workspace — seeded by `shipit install` (the managed blocks below
# need a valid manifest). Consumer-owned from here on: edit freely.
[workspace]
name = "lex-fmt_vscode"
channels = ["conda-forge"]
# osx-64 dropped (ARF02-WS04): the extension now takes lexd-lsp as a hard
# [artifact-deps] pin off the Artifact channel, whose closed subdir map serves
# NO osx-64 (arthur-debert/shipit `docs/spec/artifact-channel.md` Non-Goals +
# Platform matrix: no Intel-mac / no musl — matching the legacy `provision`
# refusal). Keeping osx-64
# would make the default-env pixi solve fail (the channel has no osx-64
# lexd-lsp). The shipped VSIX targets are darwin-arm64/linux-x64/linux-arm64
# only — there is no darwin-x64 .vsix — so this drops no release surface.
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[tasks]
# >>> shipit-managed test task (do not edit; regenerate via `shipit install`) >>>
test = "./bin/shipit test"
# <<< shipit-managed test task <<<
# >>> shipit-managed tasks (do not edit; regenerate via `shipit install`) >>>
changelog = "./bin/shipit changelog"
logs = "./bin/shipit logs"
# <<< shipit-managed tasks <<<
# The wf-checks TEST LANE's run (ADP02-WS03, #155; model lex#829). The block's
# checkout has no submodule support (the legacy vscode-ext-ci.yml caller passed
# `submodules: true`), so the lane provisions the `comms` submodule inline —
# `npm run build`'s prebuild hook (gen-theme.py --check) reads its canonical
# theme data. Then the same verbs the legacy caller ran: the shared/ module
# build hook (the extension's TypeScript depends on its compiled dist/), root
# `npm ci`, and the legacy check-command chain (typecheck via `npm run build`,
# eslint, unit tests). Integration + cspell suites stay out of the lane exactly
# as they were out of the legacy check-command (they launch a downloaded
# VS Code — not a hosted-runner-shaped check). Idempotent and cheap on a
# laptop where comms/shared are already in place.
#
# `test:vsix-payload` (INJ001-WS05, #167) is the one step here that looks at
# the shipping ARTIFACT rather than the tree: it packages a `.vsix` the way
# the release does (`vsce package --no-dependencies`) and fails when the
# tree-sitter payload — the Lex grammar wasm + queries, and the five embedded
# grammars — is not inside it. It is in the lane precisely because the suites
# that would otherwise notice (the injection integration tests' `tokenCount >
# 0` asserts) are the ones excluded above, which let a payload-less extension
# package with CI green. It fetches the Lex half per deps.json when absent
# (app-bin/ensure-lex-grammar-payload.sh) — the same download the release's
# pre-package hook does, so the lane packages what the release would.
test-full = "git submodule update --init --recursive && ./app-bin/ci-build-shared-hook.sh && npm ci && npm run build && npm run lint && npm run test:unit && npm run test:vsix-payload"

[feature.shipit-artifacts.dependencies]
# The CONSUMER-OWNED version pins for this repo's cross-repo artifacts
# (conda-direct, ADR-0077): shipit derives and projects only the CHANNEL for
# each `[artifact-deps.<pkg>]` in .shipit.toml — into the `shipit-artifacts`
# feature at the bottom of this file — and the version is an ordinary conda
# dependency HERE, in that same feature, so pixi resolves the pin against the
# derived channel and `pixi.lock` records + sha256-verifies it. `pixi lock` IS
# the agreement check: a wrong package name, version or subdir fails locally,
# before any release. Bumped by a generic bot (`pixi update` / Renovate), never
# by a shipit block.
#
# This table MUST stay outside the managed markers. It used to live inside
# them (#169): the managed block carries only `channels` under conda-direct, so
# the next reconcile regenerated it channels-only and silently dropped this
# pin — a `.vsix` packaged with no language server, no error, no red check.
#
# `==` is explicit on purpose — pixi warns a bare version is ambiguous.
#
#   lexd-lsp — the Lex language server (lex-fmt/lex), an ARCH package served on
#              this repo's three declared platforms (osx-arm64 / linux-64 /
#              linux-aarch64; the channel serves no osx-64). NOT consumed in
#              place: `[artifacts.lex-vscode].bundle.stage` in .shipit.toml
#              copies the pixi-materialized binary into `resources/lexd-lsp`
#              before `vsce package`, so each non-Windows .vsix ships the real
#              LSP the extension spawns (src/config.ts).
lexd-lsp = "==0.19.10"

[feature.lint.dependencies]
# >>> shipit-managed lint deps (do not edit; regenerate via `shipit install`) >>>
# The fleet-pinned lint toolchain (https://github.com/arthur-debert/shipit/blob/main/docs/legacy-prd/adoption.md:
# the managed set owns the consumer environment).
# Canonical versions live HERE — a bump is one data edit, rolled fleet-wide on
# each consumer's next `shipit install` reconcile.
ruff = "0.15.*"
# shellcheck is PINNED DOWN to 0.10.* (not 0.11): shellcheck 0.11.0 has an SC2218
# reaching-definitions false positive — a call to an EARLIER-defined function is
# flagged "defined later" when a subshell (`$(...)`, a pipeline component, `<(...)`)
# sits near the call, reddening the hermetic gate on CORRECT code across 5+ fleet
# repos. 0.11.0 is the latest upstream (no fixed 0.11.x yet); restore 0.11+ when
# upstream fixes it.
shellcheck = "0.10.*"
# conda-forge name for the `shfmt` binary
go-shfmt = "3.*"
yamllint = "1.38.*"
prettier = "3.8.*"
markdownlint-cli = "0.49.*"
# GitHub Actions workflow gate — the actions Lang of `shipit lint` (TOL01-WS04)
actionlint = "1.7.*"
lefthook = "2.1.*"
# <<< shipit-managed lint deps <<<

[feature.lint.tasks]
# >>> shipit-managed lint task (do not edit; regenerate via `shipit install`) >>>
lint = "./bin/shipit lint"
# <<< shipit-managed lint task <<<
# The wf-checks LINT LANE's run (ADP02-WS03, #155), byte-modeled on shipit's
# own and on lex#829: the lint toolchain (ruff/shfmt/prettier/markdownlint/
# actionlint/...) lives in THIS feature's env, so the lane task must resolve
# into the lint env — the managed bare `lint` task is a fixed plain string that
# runs in the default env, where none of those tools exist on a hosted runner
# and no lexd is on PATH for the lex leg (`shipit lint` runs `lexd check` over
# the committed *.lex docs). lexd now rides the lint env as an ordinary conda
# dep via the managed `shipit-lexd` feature wired into it below — ADR-0066
# retired the `provision lexd` verb this task used to call inline, and shipit
# fails closed on a manifest that still calls it (shipit#1070). Defined ONLY in
# this feature, so it exists in EXACTLY ONE env (lint) and bare
# `pixi run lint-full` resolves unambiguously — the wf-checks matrix job's
# `pixi run --locked lint-full` and a laptop run are identical.
lint-full = { cmd = "./bin/shipit lint" }

[environments]
# >>> shipit-managed artifact-dep environments (do not edit; regenerate via `shipit install`) >>>
default = ["shipit-artifacts"]
# <<< shipit-managed artifact-dep environments <<<
# >>> shipit-managed environments (do not edit; regenerate via `shipit install`) >>>
lint = ["lint", "shipit-lexd"]
# <<< shipit-managed environments <<<

[dependencies]
# >>> shipit-managed launcher deps (do not edit; regenerate via `shipit install`) >>>
# The pinned `bin/shipit` launcher's one prerequisite (#758, TOL02-WS17
# #794): every workflow block (wf-checks and the whole wf-release family)
# runs `pixi run --locked ./bin/shipit ...`, and the ADR-0033 launcher
# resolves the repo's shipit pin via `uv tool run` — but hosted runners do
# not carry uv, so without this block the very first `./bin/shipit` dies 127
# before any verb runs. Provisioned from conda-forge under setup-pixi's
# lockfile-keyed cache (the #582 doctrine; the spike measured the launcher's
# uv resolve at 5s cold / 0-3s warm riding this env — no extra cache step).
# Anchored under [dependencies] — the DEFAULT env — because that is exactly
# the PATH a bare `pixi run --locked <task>` resolves. Pinned to the minor
# line of Layer 0's UV_PIN (bin/setup-dev-env.sh), so dev machines and CI
# provision the same uv; a lockstep drift test (tests/test_install.py) fails
# when the two move apart. `uv build` (the python bundle composition) rides
# this same entry.
uv = "0.11.*"
# <<< shipit-managed launcher deps <<<
# >>> shipit-managed node deps (do not edit; regenerate via `shipit install`) >>>
# The fleet-pinned node runtime (#547 Layer 1) — delivered because this repo
# tracks a package.json. Unlike the rust/go blocks this is NOT a linter
# toolchain: it provisions the repo's OWN node/pnpm runtime (npm rides the
# nodejs package), which is why it lives in the DEFAULT env's [dependencies]
# rather than the lint feature. If this repo no longer ships node (the last
# package.json is gone), delete this block and its `pixi.toml#shipit-node-deps`
# entry in .shipit.toml's [managed] table — a reconcile only ADDS toolchain
# blocks, it never retires one.
nodejs = "26.*"
pnpm = "11.*"
# <<< shipit-managed node deps <<<
# Consumer-owned dependencies (ADP02-WS03, #155), outside the managed blocks.
# The wf-checks lanes run `pixi run --locked <task>` on a hosted runner where
# nothing outside pixi is provisioned.
#
# `uv` is NOT here any more: it backs the pinned bin/shipit launcher (ADR-0033)
# and the managed `shipit-launcher-deps` block above now owns it on the fleet
# pin (shipit#758 — the gap this repo's own `uv = ">=0.5"` covered until
# v1.6.0). A consumer entry for the same key makes the block skip delivery, so
# the repo would silently stay off the fleet pin.
#
# python runs app-bin/gen-theme.py (stdlib-only), `npm run build`'s prebuild
# hook — the test lane's typecheck step. The default pixi env otherwise
# carries no python, and a hosted runner's system `python` is outside pixi.
# Loose floor (not a minor pin): the script needs only the stdlib, and the
# default feature rides every env — a tight pin here would down-pin the
# managed lint env's python resolution.
python = ">=3.11"

# >>> shipit-managed artifact-dep feature `shipit-artifacts` (do not edit; regenerate via `shipit install`) >>>
[feature.shipit-artifacts]
channels = ["https://storage.googleapis.com/shipit-artifacts-public/lex-fmt/lex"]
# <<< shipit-managed artifact-dep feature `shipit-artifacts` <<<

# >>> shipit-managed lexd feature (do not edit; regenerate via `shipit install`) >>>
[feature.shipit-lexd]
# lexd — the lex Lang's lint-gate tool — resolved as an ordinary conda package
# from the public Artifact channel (ADR-0066: `provision lexd` retired). The
# channel is scoped to THIS reserved feature (a sibling of conda-forge, added to
# whatever env `shipit-lexd` is wired into — the lint env), so lexd rides
# pixi.lock and pixi's sha256 like every other linter, and `shipit install`
# keeps the whole fleet on ONE lexd version — uniformity moved from a compiled
# binary constant to this managed block (ADR-0047: not consumer config).
channels = ["https://storage.googleapis.com/shipit-artifacts-public/lex-fmt/lex"]

# The fleet-pinned lexd, PLATFORM-SCOPED via pixi `[target]` tables. This file is
# the block HEADER; `shipit install` GENERATES one
# `[feature.shipit-lexd.target.<plat>.dependencies]` table below per platform in
# (this repo's declared `[workspace].platforms` ∩ the channel's CLOSED SERVED SET
# — `SERVED_SUBDIRS`, `src/shipit/channel/buckets.py`:
# osx-arm64/linux-64/linux-aarch64 AND win-64), pinned to `LEXD_PIN`
# (`src/shipit/install/units.py`, the single pin edit) — NEVER a blanket
# `[feature.shipit-lexd.dependencies]`. See `units.lexd_block`; a bump is one edit
# to `LEXD_PIN`, rolled fleet-wide on each consumer's next reconcile.
#
# Why intersect with the repo's OWN declared platforms (#1072): a `[target]`
# selector for a platform the workspace does NOT declare makes pixi warn on EVERY
# invocation (`target selector 'win-64' does not match any of the platforms
# supported by the workspace`) — fleet-wide noise (hit on shipit's own `main`
# after #1068 emitted a fixed all-of-served target set). A repo emits a target
# only for a platform it actually declares.
#
# Why intersect with the served set (#1068) — load-bearing AND fail-closed:
#  - A BLANKET `[feature.shipit-lexd.dependencies]` applied lexd to EVERY platform
#    a composing env declares, so a consumer declaring a platform OUTSIDE the
#    served set (e.g. osx-64, Intel Mac) had no channel candidate and got an
#    unsatisfiable lint-env solve — `shipit install` then failed closed with no
#    commit and no reconcile (#1068). Platforms NOT in the served set carry NO
#    lexd dep, so their lint env SOLVES and install/reconcile no longer breaks.
#  - win-64 IS in the served set (served, merely owner-PAUSED under the Windows
#    build pause #895, ADR-0071). A repo that DECLARES win-64 keeps a win-64
#    target and FAILS CLOSED at solve (the channel serves no win-64 lexd while the
#    pause holds — ADR-0071's "Windows consumers fail closed, loudly"); a repo
#    that does NOT declare win-64 emits no win-64 target (and no dangling-selector
#    warning). It re-resolves automatically when #895 lifts — no edit here.
[feature.shipit-lexd.target.osx-arm64.dependencies]
lexd = "==0.19.10"
[feature.shipit-lexd.target.linux-64.dependencies]
lexd = "==0.19.10"
[feature.shipit-lexd.target.linux-aarch64.dependencies]
lexd = "==0.19.10"
# <<< shipit-managed lexd feature <<<
